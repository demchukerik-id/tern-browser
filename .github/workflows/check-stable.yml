# Once a day: start a build when Chromium stable for Windows has a version
# that has no Tern release yet and is not already building.
name: check-stable
on:
  schedule: [{cron: '17 6 * * *'}]
  workflow_dispatch:
permissions: {contents: read, actions: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          v=$(curl -sf 'https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Windows&num=1' | jq -r '.[0].version')
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $v"; exit 1; }
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$v already released"; exit 0; fi
          # A run for this version is already going: leave it. A run for an older
          # version is cancelled by the new one (build.yml concurrency).
          running=$(gh run list -R "$GITHUB_REPOSITORY" -w build.yml --json status,displayTitle \
            --jq "[.[] | select(.status != \"completed\" and .displayTitle == \"build $v\")] | length")
          if [ "$running" != "0" ]; then echo "build $v is already running"; exit 0; fi
          gh workflow run build.yml -R "$GITHUB_REPOSITORY" -f version="$v"
          echo "started build for $v"
